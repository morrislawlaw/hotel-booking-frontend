name: Frontend & E2E Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  e2e-testing:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the Vue Frontend Repository
      - name: Checkout Frontend Repository
        uses: actions/checkout@v4
        with:
          path: frontend

      # Step 2: Checkout the .NET API Repository alongside Frontend
      # Replace 'YourGitHubUsername' with your actual GitHub username
      - name: Checkout Backend API Repository
        uses: actions/checkout@v4
        with:
          repository: 'morrislawlaw/dotnet9_TestAPI'
          path: backend

      # Step 3: Setup Environments
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Step 4: Install Dependencies
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Step 5: Start .NET API Server in Background
      - name: Launch .NET Web API
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Testing
        run: |
          dotnet run --urls "http://localhost:5172" &
          sleep 5

      # Step 6: Run Playwright E2E Tests
      - name: Run Playwright E2E Suite
        working-directory: frontend
        env:
          CI: true
        run: npx playwright test

      # Step 7: Save Report if Tests Fail
      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7